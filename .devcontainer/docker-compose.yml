version: "3.8"

services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:20
    user: node
    init: true
    working_dir: /workspaces/is-5600-week-07
    volumes:
      - ..:/workspaces/is-5600-week-07:cached
    # Vite on port 3000 (change to `npm start` if you're using CRA)
    command: sh -c "npm ci || npm install; npm run dev -- --host --port 3000"
    depends_on:
      - server

  server:
    image: mcr.microsoft.com/devcontainers/typescript-node:20
    user: node
    init: true
    working_dir: /workspaces/is-5600-week-07/node-src
    volumes:
      - ..:/workspaces/is-5600-week-07:cached
    environment:
      PORT: 3080
      MONGODB_URI: mongodb://root:example@db:27017/?authSource=admin
    command: sh -c "npm ci || npm install; npm run dev"
    depends_on:
      - db

  db:
    image: mongo:6
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: products-db
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
